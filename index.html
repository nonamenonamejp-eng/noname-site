
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">

  <title>NO NAME™</title>
  <meta name="description" content="本質を見つめ、まだない価値をカタチに。既成概念にとらわれず、自由な発想で可能性を切り拓く。">

  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-N-32.png">
  <link rel="icon" type="image/png" href="/favicon-N.png">

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      background: #ffffff;
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #ffffff;
      color: #111111;
      font-family: Arial, "Helvetica Neue", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      padding: 76px 24px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #ffffff;
    }

    .logo {
      display: block;
      width: 440px;
      max-width: 90%;
      height: auto;
      margin: 0 auto;
      opacity: 0;
      animation: floatIn 3s ease-out 0.5s forwards;
    }

    .tagline {
      margin-top: 12px;
      font-size: 10px;
      letter-spacing: 0.24em;
      text-align: center;
      opacity: 0;
      animation: fadeIn 2s ease-out 3.8s forwards;
    }

    .concept {
      margin-top: 76px;
      text-align: center;
      opacity: 0;
      animation: floatIn 2s ease-out 5.5s forwards;
    }

    .concept-main {
      margin: 0;
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
      font-size: 21px;
      font-weight: 400;
      line-height: 1.9;
      letter-spacing: 0.08em;
    }

    .concept-sub {
      margin-top: 18px;
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
      font-size: 14px;
      font-weight: 400;
      line-height: 2.1;
      letter-spacing: 0.06em;
      color: #555555;
    }

    .what-we-do {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-top: 56px;
      padding: 8px 0;
      color: #111111;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-decoration: none;
      opacity: 0;
      animation: fadeIn 2s ease-out 7s forwards;
      transition: color 0.3s ease;
    }

    .what-we-do:hover {
      color: #777777;
    }

    .what-we-do .arrow {
      display: inline-block;
      font-size: 16px;
      line-height: 1;
      letter-spacing: 0;
      animation: arrowTravel 1.2s ease-in-out infinite alternate;
    }

    footer {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: auto;
      padding-top: 60px;
    }

    .contact {
      text-align: center;
      opacity: 0;
      animation: fadeIn 2s ease-out 8.5s forwards;
    }

    .contact-label {
      margin-bottom: 12px;
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 0.25em;
      color: #777777;
    }

    .email {
      display: inline-block;
      color: #111111;
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", sans-serif;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.08em;
      line-height: 1.8;
      text-decoration: none;
      transition: opacity 0.3s ease;
    }

    .email:hover {
      opacity: 0.5;
    }

    .copyright {
      margin-top: 48px;
      color: #111111;
      font-size: 9px;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-align: center;
      opacity: 0;
      animation: fadeIn 2s ease-out 9s forwards;
    }

    @keyframes floatIn {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    @keyframes arrowTravel {
      from {
        transform: translate(-3px, 3px);
      }
      to {
        transform: translate(3px, -3px);
      }
    }

    @media (max-width: 600px) {
      .page {
        min-height: 100vh;
        padding: 42px 18px 24px;
      }

      .logo {
        width: 440px;
        max-width: 92%;
      }

      .tagline {
        margin-top: 10px;
      }

      .concept {
        margin-top: 48px;
      }

      .concept-main {
        font-size: clamp(13px, 4.2vw, 16px);
        letter-spacing: 0.02em;
        white-space: nowrap;
      }

      .concept-sub {
        margin-top: 14px;
        font-size: 12px;
        line-height: 2;
        letter-spacing: 0.03em;
      }

      .what-we-do {
        margin-top: 32px;
      }

      footer {
        margin-top: 48px;
        padding-top: 0;
      }

      .contact {
        margin-top: 0;
      }

      .copyright {
        margin-top: 32px;
      }
    }

    @media (max-height: 700px) and (min-width: 601px) {
      .page {
        padding-top: 40px;
      }

      .concept {
        margin-top: 48px;
      }

      footer {
        padding-top: 48px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-delay: 0ms !important;
        transition-duration: 0.01ms !important;
      }

      .logo,
      .tagline,
      .concept,
      .what-we-do,
      .contact,
      .copyright {
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <header>
      <img class="logo" src="logo.png" alt="NO NAME™">
      <div class="tagline">UNBOUND, UNSTOPPABLE</div>
    </header>

    <section class="concept">
      <p class="concept-main">
        本質を見つめ、まだない価値をカタチに。
      </p>

      <div class="concept-sub">
        既成概念にとらわれず、自由な発想で<br>
        可能性を切り拓く。
      </div>
    </section>

    <a class="what-we-do" href="what-we-do.html">
      <span>WHAT WE DO</span>
      <span class="arrow" aria-hidden="true">↗</span>
    </a>

    <footer>
      <div class="contact">
        <div class="contact-label">CONTACT</div>
        <a class="email" href="mailto:info@noname.bz">
          メールでお問い合わせ
        </a>
      </div>

      <div class="copyright">© NO NAME™</div>
    </footer>

  </main>
</body>
</html>
