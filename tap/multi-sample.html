<title>TAP 複数サイト設定 見本｜NO NAME™</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
    background: #ffffff;
    color: #000000;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 56px 20px 32px;
  }
  .top-block { width: 100%; max-width: 360px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .top-block .logo-tap { width: 120px; max-width: 40vw; height: auto; display: block; }
  .top-label { width: 100%; display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 9px; letter-spacing: 0.14em; color: #000000; white-space: nowrap; }
  .top-label::before, .top-label::after { content: ""; flex: 1; height: 1px; background: #000000; }
  .links {
    margin-top: 48px;
    width: 100%;
    max-width: 360px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .links a {
    display: block;
    text-align: center;
    padding: 16px 20px;
    border-radius: 999px;
    border: 2px solid #000000;
    background: #ffffff;
    color: #000000;
    text-decoration: none;
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.5px;
    transition: background 0.2s, color 0.2s;
  }
  .links a:hover, .links a:focus { background: #000000; color: #ffffff; }
  /* 登録していないSNSは非表示にする（data-url を空にすると自動で隠れる） */
  .links a[hidden] { display: none; }
  /* ボタンを上から順に出す（ふわっと降りてくる） */
  @keyframes dropIn {
    from { opacity: 0; transform: translateY(-18px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .links a {
    opacity: 0;
    animation: dropIn 0.5s ease-out forwards;
  }
  .links a:nth-child(1) { animation-delay: 0.15s; }
  .links a:nth-child(2) { animation-delay: 0.30s; }
  .links a:nth-child(3) { animation-delay: 0.45s; }
  .links a:nth-child(4) { animation-delay: 0.60s; }
  .links a:nth-child(5) { animation-delay: 0.75s; }
  @media (prefers-reduced-motion: reduce) {
    .links a { opacity: 1; animation: none; }
  }
  /* ボタンが上から順番に出てくる（動きを控えたい設定の端末では、すぐ表示する） */
  @keyframes dropIn {
    from { opacity: 0; transform: translateY(-14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .links a { opacity: 0; animation: dropIn 0.5s ease-out forwards; }
  .links a:nth-child(1) { animation-delay: 0.1s; }
  .links a:nth-child(2) { animation-delay: 0.25s; }
  .links a:nth-child(3) { animation-delay: 0.4s; }
  .links a:nth-child(4) { animation-delay: 0.55s; }
  .links a:nth-child(5) { animation-delay: 0.7s; }
  @media (prefers-reduced-motion: reduce) {
    .links a { opacity: 1; animation: none; }
  }
  /* ボタンが上から順に出てくる（表示時のみ。動きを減らす設定の端末では即表示） */
  @keyframes dropIn {
    from { opacity: 0; transform: translateY(-24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .links a:not([hidden]) {
    opacity: 0;
    animation: dropIn 0.6s ease-out forwards;
  }
  .links a:not([hidden]):nth-child(1) { animation-delay: 0.1s; }
  .links a:not([hidden]):nth-child(2) { animation-delay: 0.25s; }
  .links a:not([hidden]):nth-child(3) { animation-delay: 0.4s; }
  .links a:not([hidden]):nth-child(4) { animation-delay: 0.55s; }
  .links a:not([hidden]):nth-child(5) { animation-delay: 0.7s; }
  @media (prefers-reduced-motion: reduce) {
    .links a:not([hidden]) { opacity: 1; animation: none; }
  }
  .footer {
    margin-top: 48px;
    padding-top: 0;
  }
  .footer a { display: block; }
  .logo-noname { width: 160px; max-width: 50vw; height: auto; display: block; }
</style>
