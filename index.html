
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">

  <title>NO NAME™</title>
  <meta
    name="description"
    content="本質を見つめ、まだない価値をカタチに。既成概念にとらわれず、自由な発想で可能性を切り拓く。"
  >

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      background: #ffffff;
      color: #111111;
      font-family:
        "Helvetica Neue",
        Arial,
        "Noto Sans JP",
        sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px 28px;
      background: #ffffff;
    }

    .main {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* ロゴ：ゆっくり浮かび上がる */
    .logo {
      display: block;
      width: 440px;
      max-width: 90%;
      height: auto;
      margin: 0 auto;
      opacity: 0;
      animation: floatIn 3s ease-out 0.5s forwards;
    }

    /* ブランドタグライン：ロゴの後に表示 */
    .tagline {
      margin: 12px 0 0;
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.24em;
      line-height: 1.8;
      color: #444444;
      opacity: 0;
      animation: fadeIn 2s ease-out 3.8s forwards;
    }

    /* コンセプト：さらに後からゆっくり表示 */
    .concept {
      margin: 76px 0 0;
      font-size: 21px;
      font-weight: 400;
      line-height: 1.9;
      letter-spacing: 0.055em;
      color: #171717;
      opacity: 0;
      animation: floatIn 3s ease-out 5.5s forwards;
    }

    .concept-sub {
      display: block;
      margin-top: 12px;
      font-size: 14px;
      font-weight: 400;
      line-height: 2;
      letter-spacing: 0.035em;
      color: #777777;
    }

    /* メールお問い合わせ：最後に表示 */
    .contact {
      margin: 72px 0 0;
      font-size: 12px;
      font-weight: 400;
      line-height: 1.8;
      letter-spacing: 0.08em;
      opacity: 0;
      animation: fadeIn 2s ease-out 8.5s forwards;
    }

    .contact a {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 10px 2px;
      color: #333333;
      text-decoration: none;
      transition: opacity 0.3s ease;
    }

    .mail-icon {
      font-size: 15px;
      line-height: 1;
    }

    .contact a:hover {
      opacity: 0.55;
    }

    .contact a:focus-visible {
      outline: 1px solid #888888;
      outline-offset: 5px;
    }

    /* コピーライト */
    .copyright {
      margin-top: 58px;
      color: #888888;
      font-size: 10px;
      font-weight: 400;
      line-height: 1.8;
      letter-spacing: 0.08em;
      text-align: center;
      opacity: 0;
      animation: fadeIn 2s ease-out 9s forwards;
    }

    /* 浮かび上がる動き */
    @keyframes floatIn {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 静かに現れる動き */
    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    /* スマートフォン */
    @media (max-width: 600px) {
      .page {
        padding: 36px 22px 24px;
      }

      .logo {
        width: 440px;
        max-width: 100%;
      }

      .tagline {
        margin-top: 10px;
        font-size: 9px;
        letter-spacing: 0.19em;
      }

      .concept {
        margin-top: 62px;
        font-size: 18px;
        line-height: 2;
        letter-spacing: 0.035em;
      }

      .concept-sub {
        margin-top: 12px;
        font-size: 12px;
        line-height: 2.1;
        letter-spacing: 0.015em;
      }

      .contact {
        margin-top: 52px;
        font-size: 11px;
      }

      .copyright {
        margin-top: 44px;
        font-size: 9px;
      }
    }

    /* 高さが小さい画面 */
    @media (max-height: 700px) {
      .page {
        justify-content: flex-start;
        padding-top: 40px;
      }

      .concept {
        margin-top: 48px;
      }

      .contact {
        margin-top: 42px;
      }

      .copyright {
        margin-top: 32px;
      }
    }

    /* 動きを控えたい端末ではアニメーションを省略 */
    @media (prefers-reduced-motion: reduce) {
      .logo,
      .tagline,
      .concept,
      .contact,
      .copyright {
        animation: none;
        opacity: 1;
        transform: none;
      }

      .contact a {
        transition: none;
      }
    }
  </style>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-N-32.png">
<link rel="icon" type="image/png" sizes="256x256" href="/favicon-N.png">
</head>

<body>
  <div class="page">

    <main class="main">

      <img
        class="logo"
        src="logo.png"
        alt="NO NAME™"
      >

      <p class="tagline">
        UNBOUND, UNSTOPPABLE
      </p>

      <h1 class="concept">
        本質を見つめ、まだない価値をカタチに
        <span class="concept-sub">
          既成概念にとらわれず、自由な発想で可能性を切り拓く
        </span>
      </h1>

      <p class="contact">
        <a href="mailto:info@noname.bz">
          <span class="mail-icon" aria-hidden="true">✉</span>
          <span>メールでお問い合わせ</span>
        </a>
      </p>

    </main>

    <footer class="copyright">
      © NO NAME™
    </footer>

  </div>
</body>
</html>
